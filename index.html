  ${songs.length ? `<div class="tp songs" id="tp-songs" hidden>${songs.map(s => `<a class="song" href="${s.url || "#"}" target="_blank" rel="noopener"><strong>${s.title}</strong>, ${s.artist}<br><span class="team">${s.note || ""}</span></a>`).join("")}</div>` : ""}
  <div class="now"><h3>Right now</h3>${C.now.map(n => `<p>${n}</p>`).join("")}</div></section>
<section id="contact"><h2>Say hi</h2><div class="compose"><p class="lead">Pick what fits and I'll draft the email for you.</p>
  <div class="chips">${C.reasons.map((r, i) => `<button class="chip${i ? "" : " on"}" data-i="${i}">${r[0]}</button>`).join("")}</div>
  <label class="nm">Your name <input id="nm" placeholder="optional" autocomplete="name"></label><blockquote id="pv"></blockquote>
  <div class="links"><a class="send" id="send" href="#">Open in my email app</a><button id="copy">Copy email</button><span>${C.email}</span></div></div></section>`;
$("#foot").innerHTML = `<div class="fi"><div><strong>Saanvi Kakkar</strong><small>Computer science student, Bengaluru</small></div>
<nav aria-label="Footer"><a href="#work">Work</a><a href="#journey">Journey</a><a href="#notebook">Notebook</a><a href="#contact">Contact</a></nav>
<div class="soc"><a href="${L.linkedin}" target="_blank" rel="noopener">LinkedIn</a><a href="${L.github}" target="_blank" rel="noopener">GitHub</a><a href="${L.resume}" target="_blank" rel="noopener">Resume</a></div></div>
<p class="copy team">© ${new Date().getFullYear()} Saanvi Kakkar</p>`;
$("#copy").onclick = async (e) => { try { await navigator.clipboard.writeText(C.email); e.target.textContent = "Copied"; } catch { e.target.textContent = C.email; } };

// ---------- Theme ----------
const root = document.documentElement, tbtn = $("#theme");
const setTheme = (t) => { root.dataset.theme = t; tbtn.textContent = t === "dark" ? "Day mode" : "Night mode"; try { localStorage.setItem("theme", t); } catch {} cols(); };
tbtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

// ---------- Companion: a particle sphere that turns into a little robot ----------
const cv = $("#buddy"), g = cv.getContext("2d"), DPR = Math.min(devicePixelRatio || 1, 2), BASE = 480, glow = $("#glow");
cv.width = cv.height = BASE * DPR;
// k: 0 = body (cream), 1 = limbs (rose), 2 = eyes (bright)
const ell = (c, r, n, k) => Array.from({ length: n }, () => { const u = Math.random() * 2 - 1, t = Math.random() * 6.283, s = Math.sqrt(1 - u * u);
  return { x: c[0] + r[0] * s * Math.cos(t), y: c[1] + r[1] * u, z: c[2] + r[2] * s * Math.sin(t), k }; });
const R = [...ell([0, .78, 0], [.62, .5, .5], 800, 0), ...ell([0, -.15, 0], [.38, .45, .3], 420, 0),
  ...[-1, 1].flatMap((s) => [...ell([s * .68, -.12, 0], [.13, .38, .13], 220, 1), ...ell([s * .7, -.58, 0], [.14, .14, .14], 90, 1),
    ...ell([s * .24, -.95, 0], [.16, .3, .16], 200, 1), ...ell([s * .26, -1.32, .1], [.19, .08, .27], 110, 1)]),
  ...ell([0, 1.36, 0], [.05, .12, .05], 30, 1), ...ell([-.24, .82, .47], [.13, .13, .03], 120, 2), ...ell([.24, .82, .47], [.13, .13, .03], 120, 2)];
const N = R.length, perm = [...R.keys()].sort(() => Math.random() - .5);
const P = R.map((r, i) => { const k = perm[i], y = 1 - 2 * (k + .5) / N, rad = Math.sqrt(1 - y * y), a = k * 2.39996;
  return { sx: 1.1 * rad * Math.cos(a), sy: 1.1 * y, sz: 1.1 * rad * Math.sin(a), rx: r.x, ry: r.y, rz: r.z, k: r.k, d: [Math.random() - .5, Math.random() - .5, Math.random() - .5], ox: 0, oy: 0 }; });
const U = new Float32Array(N), V = new Float32Array(N), Zs = new Float32Array(N), S = new Float32Array(N);
let col = {}; function cols() { const s = getComputedStyle(root); col = [s.getPropertyValue("--fg").trim(), s.getPropertyValue("--acc").trim(), root.dataset.theme === "dark" ? "#fff6e6" : "#fff0f3"]; }
let mx = -1e4, my = -1e4, gx = -1e4, gy = -1e4, burst = 0, p = 0, line = "";
addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
document.documentElement.addEventListener("pointerleave", () => { mx = my = -1e4; });
const say = (t) => { line = t || line; const b = $("#bubble"); b.textContent = line; b.classList.toggle("on", p > .6 && !!line); };
cv.onclick = () => { const d = ["Hi! I'm her sidekick.", "Ow. That tickles.", "Beep. Just kidding.", "Scroll up and I'll turn back into a sphere."]; burst = 1;
  M.animate && !reduce ? M.animate(1, 0, { duration: 1.4, onUpdate: (v) => (burst = v) }) : (burst = 0); say(d[Math.floor(Math.random() * d.length)]); };
function layout() { const w = innerWidth, h = innerHeight, mob = w < 760;
  p = Math.min(1, scrollY / (h * .7)); const e = p * p * (3 - 2 * p);
  const hs = mob ? Math.min(w * .8, h * .38) : Math.min(w * .5, h * .75, 560), ds = mob ? 84 : 112;
  const hx = mob ? w / 2 : w * .74, hy = mob ? h * .74 : h * .52, dx = w - ds / 2 - 14, dy = h - ds / 2 - 14;
  const s = hs + (ds - hs) * e, x = hx + (dx - hx) * e, y = hy + (dy - hy) * e;
  cv.style.width = cv.style.height = s + "px"; cv.style.transform = `translate(${x - s / 2}px,${y - s / 2}px)`; $("#bubble").classList.toggle("on", p > .6 && !!line); return e; }
const t0 = performance.now();
function frame(now) { const m = layout(), t = (now - t0) / 1000, ang = reduce ? 0 : (1 - m) * t * .35 + m * Math.max(-1, Math.min(1, (mx / innerWidth - .5) * 2)) * .5, ca = Math.cos(ang), sa = Math.sin(ang), K = BASE * DPR * .25;
  const rc = cv.getBoundingClientRect(), lx = (mx - rc.left) / rc.width * cv.width - cv.width / 2, ly = (my - rc.top) / rc.height * cv.height - cv.height / 2, RAD = K * .75;
  P.forEach((q, i) => { const x = q.sx + (q.rx - q.sx) * m + q.d[0] * burst, y = q.sy + (-q.ry - q.sy) * m + q.d[1] * burst, z = q.sz + (q.rz - q.sz) * m + q.d[2] * burst;
    const X = x * ca + z * sa, Z = -x * sa + z * ca, f = 3 / (3 - Z), u = X * f * K, v = y * f * K; let tx = 0, ty = 0;
    if (!reduce) { const dx = u - lx, dy = v - ly, d = Math.hypot(dx, dy) || 1; if (d < RAD) { const a = (1 - d / RAD) ** 2 * K * .6; tx = dx / d * a; ty = dy / d * a; } }
    q.ox += (tx - q.ox) * .13; q.oy += (ty - q.oy) * .13; U[i] = u + q.ox; V[i] = v + q.oy; Zs[i] = Z; S[i] = (q.k === 2 ? 2.6 : 1.5) * f * DPR; });
  g.clearRect(0, 0, cv.width, cv.height); g.translate(cv.width / 2, cv.height / 2);
  for (const k of [0, 1, 2]) { g.fillStyle = col[k]; P.forEach((q, i) => { if (q.k !== k) return; g.globalAlpha = Math.max(.15, .4 + .6 * (Zs[i] + 1.2) / 2.4); g.fillRect(U[i] - S[i] / 2, V[i] - S[i] / 2, S[i], S[i]); }); }
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  if (!reduce) { gx += (mx - gx) * .1; gy += (my - gy) * .1; glow.style.transform = `translate(${gx - 260}px,${gy - 260}px)`; requestAnimationFrame(frame); } }
addEventListener("scroll", () => reduce && frame(performance.now()), { passive: true }); addEventListener("resize", () => reduce && frame(performance.now()));
let saved = "dark"; try { saved = localStorage.getItem("theme") || "dark"; } catch {}
setTheme(saved); requestAnimationFrame(frame);

// ---------- Detail panel (projects and books): the item lifts into a centred view ----------
const modal = document.createElement("div"); modal.id = "modal"; modal.hidden = true;
modal.innerHTML = `<div class="back"></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="mt"><button class="x">Close</button><div id="mc"></div></div>`; document.body.append(modal);
const panel = $(".panel", modal); let openCard = null;
const flip = (card) => { const a = card.getBoundingClientRect(), b = panel.getBoundingClientRect(); return { x: a.left + a.width / 2 - (b.left + b.width / 2), y: a.top + a.height / 2 - (b.top + b.height / 2), scaleX: a.width / b.width, scaleY: a.height / b.height }; };
function openM(html, card) { openCard = card; $("#mc").innerHTML = html; modal.hidden = false; document.body.style.overflow = "hidden";
  if (M.animate && !reduce) { const f = flip(card); M.animate($(".back", modal), { opacity: [0, 1] }, { duration: .3 }); M.animate(panel, { x: [f.x, 0], y: [f.y, 0], scaleX: [f.scaleX, 1], scaleY: [f.scaleY, 1], opacity: [.3, 1] }, { duration: .5, ease: [.2, .8, .2, 1] }); }
  $(".x", modal).focus(); }
function closeP() { if (modal.hidden) return; const done = () => { modal.hidden = true; document.body.style.overflow = ""; openCard && openCard.focus(); };
  if (M.animate && !reduce && openCard) { const f = flip(openCard); M.animate($(".back", modal), { opacity: [1, 0] }, { duration: .3 }); M.animate(panel, { x: [0, f.x], y: [0, f.y], scaleX: [1, f.scaleX], scaleY: [1, f.scaleY], opacity: [1, .2] }, { duration: .35 }).then(done); } else done(); }
const projHTML = (q) => `${q.status ? `<span class="badge">${q.status}</span>` : ""}<h3 id="mt">${q.title}</h3><p>${q.summary}</p><ul class="more">${q.details.map(d => `<li>${d}</li>`).join("")}</ul>
  <ul class="stack">${q.stack.map(s => `<li>${s}</li>`).join("")}</ul>${q.team ? `<p class="team">${q.team}</p>` : ""}${q.link ? `<a href="${q.link}" target="_blank" rel="noopener">See the code on GitHub</a>` : ""}`;
const act = (el, fn) => { el.onclick = fn; el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }; };
$$(".grid .card").forEach((c) => act(c, () => openM(projHTML(C.projects[c.dataset.i]), c)));
$$(".book").forEach((b) => b.addEventListener("click", () => { const k = books[b.dataset.b]; openM(`<span class="badge">${SL[k.status]}</span><h3 id="mt">${k.title}</h3><p class="team">${k.author}, ${k.genre}</p><p>${k.take}</p>`, b); }));
$(".back", modal).onclick = closeP; $(".x", modal).onclick = closeP; addEventListener("keydown", (e) => e.key === "Escape" && closeP());

// ---------- Notebook: tabs, bookshelf filter, auto-turning barrel carousel ----------
$$(".tab").forEach((t) => t.onclick = () => { $$(".tab").forEach((x) => x.setAttribute("aria-selected", x === t)); $$(".tp").forEach((p) => (p.hidden = p.id !== "tp-" + t.dataset.k)); });
$$("#tp-books .chip").forEach((c) => c.onclick = () => { $$("#tp-books .chip").forEach((x) => x.classList.toggle("on", x === c)); $$(".book").forEach((b) => (b.hidden = !!c.dataset.g && b.dataset.g !== c.dataset.g)); });
const items = $$(".bitem"), n = items.length, ring = $(".ring"), barrel = $(".barrel");
let pos = 0, target = 0, anim = null, moved = false, drag = false, hv = false, until = 0, sx = 0, sp = 0;
const cur = () => ((Math.round(target) % n) + n) % n;
const geo = () => { const W = Math.min(innerWidth * .8, 420), R = Math.min(innerWidth * .6, 560); return { R, step: 2 * Math.asin(Math.min(1, 1.12 * W / (2 * R))) * 180 / Math.PI }; };
function place() { const { R, step } = geo(); ring.style.transform = `translateZ(${-R}px)`;
  items.forEach((el, i) => { let d = (((i - pos) % n) + n) % n; if (d > n / 2) d -= n; const a = d * step, ab = Math.abs(a);
    el.style.transform = `translateX(-50%) rotateY(${a}deg) translateZ(${R}px)`; el.style.opacity = ab > 80 ? 0 : 1 - ab / 120; el.style.pointerEvents = ab > 80 ? "none" : "auto";
    el.style.zIndex = 100 - Math.round(ab); el.style.filter = `brightness(${1 - Math.min(ab, 60) / 100})`; });
  $("#count").textContent = `${cur() + 1} / ${n}`; }
function go(t) { target = t; anim && anim.stop && anim.stop();
  if (M.animate && !reduce) anim = M.animate(pos, target, { type: "spring", stiffness: 90, damping: 18, onUpdate: (v) => { pos = v; place(); } }); else { pos = target; place(); } }
barrel.addEventListener("pointerdown", (e) => { drag = true; moved = false; sx = e.clientX; sp = pos; until = Date.now() + 6000; anim && anim.stop && anim.stop(); });
addEventListener("pointermove", (e) => { if (!drag) return; const dx = e.clientX - sx; if (Math.abs(dx) > 6) moved = true; pos = sp - dx / 240; place(); });
addEventListener("pointerup", () => { if (!drag) return; drag = false; go(Math.round(pos)); });
ring.addEventListener("click", (e) => { const it = e.target.closest(".bitem"); if (!it) return; if (moved) { e.preventDefault(); return; }
  const i = +it.dataset.i; if (i !== cur()) { e.preventDefault(); let d = (((i - target) % n) + n) % n; if (d > n / 2) d -= n; go(Math.round(target) + Math.round(d)); } }, true);
barrel.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(Math.round(target) + 1); if (e.key === "ArrowLeft") go(Math.round(target) - 1); });
const box = $("#tp-thoughts"); box.onpointerenter = () => (hv = true); box.onpointerleave = () => (hv = false); box.onfocusin = () => (until = Date.now() + 8000);
$("#prev").onclick = () => { until = Date.now() + 6000; go(Math.round(target) - 1); }; $("#next").onclick = () => { until = Date.now() + 6000; go(Math.round(target) + 1); };
setInterval(() => { if (!reduce && n > 1 && !hv && !drag && !document.hidden && !box.hidden && Date.now() > until) go(Math.round(target) + 1); }, 3800);
addEventListener("resize", place); place();

// ---------- Contact: pick a reason, preview the email, open it ----------
let ri = 0; const nm = $("#nm");
function upd() { const r = C.reasons[ri], name = nm.value.trim(), body = `Hi Saanvi,\n\n${r[2]}\n\n${name ? "Thanks,\n" + name : ""}`.trim();
  $("#pv").textContent = body; $("#send").href = `mailto:${C.email}?subject=${encodeURIComponent(r[1])}&body=${encodeURIComponent(body)}`; }
$$(".compose .chip").forEach((b) => (b.onclick = () => { ri = +b.dataset.i; $$(".compose .chip").forEach((x) => x.classList.toggle("on", x === b)); upd(); }));
nm.oninput = upd; upd();

// ---------- Motion moments ----------
const { animate, hover, scroll, stagger } = M;
if (animate && !reduce) {
  animate(".hero h1", { opacity: [0, 1], y: [30, 0] }, { duration: .9 });
  animate(".hero p, .hero .about", { opacity: [0, 1] }, { duration: .9, delay: stagger ? stagger(.25, { startDelay: .5 }) : .6 });
  try { hover?.(".grid .card, .reason", (el) => { animate(el, { y: -5 }, { type: "spring", stiffness: 300, damping: 18 }); return () => animate(el, { y: 0 }, { type: "spring", stiffness: 300, damping: 18 }); }); } catch {}
  try { scroll?.(animate(".tl .fill", { scaleY: [0, 1] }), { target: $(".tl"), offset: ["start 75%", "end 60%"] }); } catch {}
} else { $$(".tl .fill").forEach((f) => (f.style.transform = "scaleY(1)")); }
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting && C.buddy[e.target.id]) say(C.buddy[e.target.id]); }), { threshold: .45 });
["work", "journey", "notebook", "contact"].forEach((id) => io.observe($("#" + id)));
</script>
